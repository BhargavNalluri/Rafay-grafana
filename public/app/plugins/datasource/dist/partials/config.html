<div class="gf-form-group">
	<h3 class="page-heading">HTTP</h3>
  <div class="gf-form-group">
    <div class="gf-form-inline">
      <div class="gf-form max-width-30">
        <span class="gf-form-label width-10">URL*</span>
        <input class="gf-form-input gf-form-input--has-help-icon" type="text"
              ng-model='ctrl.current.jsonData.base_url' placeholder="{{suggestUrl}}"
              bs-typeahead="getSuggestUrls"  min-length="0"
              ng-pattern="/^(ftp|http|https):\/\/(\w+:{0,1}\w*@)?(\S+)(:[0-9]+)?(\/|\/([\w#!:.?+=&%@!\-\/]))?$/" required></input>
        <info-popover mode="right-absolute">
          <p>Specify a complete HTTP URL (for example http://your_server:8080)</p>
          <span ng-show="current.access === 'direct'">
            Your access method is <em>Browser</em>, this means the URL
            needs to be accessible from the browser.
          </span>
        </info-popover>
      </div>
		</div>

		<div class="gf-form-inline">
      <div class="gf-form max-width-30">
				<span class="gf-form-label width-10">Module*</span>
				<div class="gf-form-select-wrapper max-width-24">
					<select 
						class="gf-form-input"
						ng-model="ctrl.current.jsonData.module"
					>
						<option value="procdevstats" selected>procdevstats</option>
					</select>
				</div>
      </div>
		</div>

		<div class="gf-form-inline">
			<div class="gf-form max-width-30">
				<span class="gf-form-label width-10">Access</span>
				<div class="gf-form-select-wrapper max-width-24">
					<select class="gf-form-input" ng-model="current.access" ng-options="f.key as f.value for f in [{ key: 'direct', value: 'Browser'}]"></select>
				</div>
			</div>
		</div>
	</div>

	<div class="gf-form-group">
		<h6>Basic Auth Details</h6>
		<div class="gf-form" >
			<span class="gf-form-label width-10">User*</span>
			<input class="gf-form-input max-width-21" type="text"  ng-model='ctrl.current.jsonData.username' placeholder="user" required></input>
		</div>
		<div class="gf-form">
            <div class="gf-form" >
                <span class="gf-form-label width-10">Password*</span>
                <input type="password" class="gf-form-input max-width-21" type="text"  ng-model='ctrl.current.jsonData.userPass' placeholder="password" required></input>
            </div>
		</div>
		<div class="gf-form">
			<div class="gf-form" >
					<span class="gf-form-label width-10">Premise</span>
					<input type="text" class="gf-form-input max-width-21" type="text"  ng-model='ctrl.current.jsonData.premise' placeholder="Premise"></input>
			</div>
		</div>
    </div>
    
</div>
